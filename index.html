<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Trade Pilot</title>
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css?v=20260322-40" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>Risk Pilot</h1>
        <p class="subtitle">Enter Entry and SL</p>
      </div>
    </header>

    <section class="panel common-panel">
      <div class="panel-title-row">
        <h2>Lot Calculator</h2>
        <div id="save-status" class="save-status is-hidden">Saved</div>
      </div>

      <div class="grid common-grid">
        <label class="field field-main">
          <span class="label">Entry rate</span>
          <input id="entry" type="text" inputmode="numeric" autocomplete="off" placeholder="150.000" />
        </label>

        <label class="field field-main">
          <span class="label">SL rate</span>
          <input id="sl" type="text" inputmode="numeric" autocomplete="off" placeholder="149.900" />
        </label>
      </div>

      <div class="rr-row">
        <label class="field field-rr">
          <span class="label">RR setting</span>
          <input id="rr" type="text" inputmode="decimal" autocomplete="off" placeholder="2.5" />
        </label>
      </div>

      <div class="quick-stats">
        <div class="stat">
          <span class="stat-label">SL pips</span>
          <strong id="global-sl-pips">0.0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">TP pips</span>
          <strong id="global-tp-pips">0.0</strong>
        </div>
      </div>
    </section>

    <section class="accounts-header">
      <h2>Accounts</h2>
      <button id="add-card-btn" class="add-btn" type="button" aria-label="Add account">+</button>
    </section>

    <section id="hidden-section" class="panel hidden-panel hidden">
      <div class="panel-title-row">
        <h2 class="hidden-title">Archived</h2>
      </div>
      <div id="hidden-cards-list" class="hidden-cards-list"></div>
    </section>

    <main id="cards" class="cards"></main>
  </div>

  <script src="app.js?v=20260322-40"></script>
</script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch((error) => {
          console.error("Service Worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
